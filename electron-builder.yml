appId: com.wirelessboard.app
productName: Wirelessboard Server
extraResources:
  - from: dist/wirelessboard-service
    to: dist/wirelessboard-service
asar: true
asarUnpack:
  - dist/**
directories:
  buildResources: build
  output: release/${platform}
files:
  - from: .
    filter:
      - "**/*"
      - "!**/.venv{,/**}"
      - "!release{,/**}"
      - "!dist/wirelessboard-service{,/**}"
  - "!builder*.log"
  - "!build.log"
  - "!builder-output.log"
mac:
  icon: resources/wirelessboard.icns
  category: public.app-category.utilities
  extendInfo:
    # LSUIElement alone is what makes this a menu-bar agent: no Dock icon, but
    # still permitted to show the Tray and the config window that main.js opens.
    # LSBackgroundOnly used to be set alongside it, which declares the opposite —
    # that the process presents no UI at all — and the two together ask macOS for
    # something incoherent. Removed while chasing an immediate crash on macOS 26.
    LSUIElement: true
    # macOS 15 and later gate local-network access behind user consent. Discovery
    # listens on multicast 239.255.254.253:8427 and probes receivers on TCP 2202,
    # so without permission the app finds nothing and reports no error. Supplying
    # a usage string is what makes the prompt appear with an explanation rather
    # than a bare request — which matters here because a menu-bar agent has no
    # window for the user to associate the prompt with.
    NSLocalNetworkUsageDescription: >-
      Wirelessboard finds your Shure receivers on the local network and reads
      their channel, battery, and audio levels.
  # No arch list here on purpose. Each CI job passes --arm64 or --x64 and runs
  # on a runner of that architecture, because the bundled PyInstaller service is
  # built natively and is not universal. Building both arches on one runner
  # shipped an arm64 service inside the Intel app.
  target:
    - dmg
    - zip
  artifactName: wirelessboard-server-${version}-mac-${arch}.${ext}
  # Required for notarization. Entitlements live in resources/ because
  # electron-builder's default buildResources directory (build/) is gitignored.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
win:
  target:
    - nsis
  artifactName: wirelessboard-server-${version}-win.${ext}
  legalTrademarks: Wirelessboard
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
linux:
  category: Utility
  target:
    - AppImage
  artifactName: wirelessboard-server-${version}-${arch}.${ext}
  maintainer: Wirelessboard Maintainers <wirelessboard@example.com>
  synopsis: Wirelessboard monitoring server
  description: |
    Wirelessboard bundles a Python-based Shure monitoring backend with an Electron tray application
    that makes launching and managing the service simple across desktop platforms.
