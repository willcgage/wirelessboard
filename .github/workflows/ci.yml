name: CI

# The test suite ran only on a release tag, so a pull request could be merged
# on the strength of the version-sync check alone -- the one check that did run
# compares two version strings and knows nothing about the code. #46, #47 and
# #48 all merged that way, and the tests they added did not run in CI until
# afterwards, on the tag.
#
# Deliberately the *same* job releases.yml gates on, called rather than copied.
# A CI job that has drifted from the release gate is worse than no CI job at
# all, because it reports green on something other than what ships.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

# Superseding a pull request run is safe and saves a fair amount of time when a
# branch is pushed repeatedly. Release runs are never cancelled: this is also
# the release gate, and cancelling it would fail the packaging jobs behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, Test, and Build Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r py/requirements.txt
          python -m pip install pytest
      - name: Lint JavaScript
        run: npm run lint
        continue-on-error: true
      - name: Build frontend bundle
        run: npm run build
        # static/ is committed, so it can fall behind js/ with nothing to say
        # so: 1.10.0 shipped bundles still reporting 1.9.1, and CI stayed green
        # throughout because building into a clean workspace never compares the
        # result against what is checked in. The build above has just
        # regenerated them, so anything git sees now is a difference between the
        # committed bundles and the source they claim to come from.
        #
        # Two checks rather than one `git status --porcelain`, which reports a
        # file as modified whenever the rebuild rewrites it with different line
        # endings even though the normalized content is identical -- on a
        # core.autocrlf checkout that is every bundle, every time. `git diff`
        # applies the same normalization git would on commit, so it answers the
        # question actually being asked. It cannot see untracked files, hence
        # the second check: an entry added to webpack.config.js without
        # committing what it emits shows up there and nowhere else.
        #
        # That second check deliberately omits --exclude-standard. .gitignore
        # lists static/*.js as webpack output, so a newly emitted bundle arrives
        # ignored and --exclude-standard would hide the one thing being looked
        # for. The four bundles that are tracked predate that rule and stay
        # tracked regardless of it. On a fresh CI checkout nothing else lands
        # under static/, so there is nothing for the wider net to catch by
        # mistake -- this is why the step is not meant to be run locally.
      - name: Check committed bundles match the build
        run: |
          drift=0
          if ! git diff --quiet -- static/; then
            echo "::error::static/ does not match a fresh build of js/."
            git diff --stat -- static/
            drift=1
          fi
          untracked="$(git ls-files --others -- static/)"
          if [ -n "$untracked" ]; then
            echo "::error::the build emitted files that are not committed:"
            echo "$untracked"
            drift=1
          fi
          if [ "$drift" -ne 0 ]; then
            echo "Run 'npm run build' and commit static/, or bump the version with"
            echo "'npm version <bump>', which rebuilds and stages it for you."
            exit 1
          fi
          echo "static/ matches a fresh build."
      - name: Check Python sources compile
        run: python -m compileall py
      - name: Run Python tests
        run: python -m pytest py/tests -q
        # node:test ships with Node 22, so the main-process logic is covered
        # without adding a test framework. It is pure by construction -- no
        # electron import, network injected -- precisely so it can run here.
      - name: Run JavaScript tests
        run: npm run test:js
