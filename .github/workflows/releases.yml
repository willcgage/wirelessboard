name: Build and Package Wirelessboard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_pi:
        description: 'Build Raspberry Pi tarball (requires self-hosted ARM runner)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Lint, Test, and Build Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r py/requirements.txt
          python -m pip install pytest
      - name: Lint JavaScript
        run: npm run lint
        continue-on-error: true
      - name: Build frontend bundle
        run: npm run build
      - name: Check Python sources compile
        run: python -m compileall py
      - name: Run Python tests
        run: python -m pytest py/tests -q

  package-desktop:
    name: Package desktop apps
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # artifact_folder must match electron-builder.yml's `output:
          # release/${platform}`, where ${platform} is Node's process.platform
          # — hence darwin and win32, not mac and win.
          #
          # The two macOS entries are deliberate: the bundled PyInstaller
          # service is built natively and is not universal, so each arch must
          # be packaged on a runner of that same arch. Building both on one
          # runner put an arm64 service inside the Intel app.
          # macos-15-intel is the last x86_64 image GitHub offers (macos-13 was
          # retired in Dec 2025); it goes away in Aug 2027.
          - runner: macos-latest
            release_script: npm run release:mac:ci:arm64
            artifact_folder: release/darwin
            artifact_name: wirelessboard-macos-arm64
          - runner: macos-15-intel
            release_script: npm run release:mac:ci:x64
            artifact_folder: release/darwin
            artifact_name: wirelessboard-macos-x64
          - runner: windows-latest
            release_script: npm run release:win:ci
            artifact_folder: release/win32
            artifact_name: wirelessboard-windows
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WIRELESSBOARD_REMOVE_VENV: 'false'
      # Developer ID signing. Absent secrets mean electron-builder skips
      # signing and the app ships unsigned, exactly as it did before.
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      # Notarization credentials, read by electron-builder when notarize is on.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: npm ci
      - name: Verify pinned electron rebuild
        run: npm ls @electron/rebuild
      - name: Install Python dependencies (handled by npm postinstall)
        shell: bash
        run: |
          echo "=== Python environment diagnostics ==="
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          echo "Working directory: $(pwd)"
          
          # List virtual environment contents for debugging
          if [ -d ".venv" ]; then
            echo "Virtual environment exists"
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "Contents of .venv/Scripts:"
              ls -la .venv/Scripts/ || echo "Could not list .venv/Scripts/"
              PYTHON_EXE="./.venv/Scripts/python.exe"
            else
              echo "Contents of .venv/bin:"
              ls -la .venv/bin/ || echo "Could not list .venv/bin/"
              PYTHON_EXE="./.venv/bin/python"
            fi
            
            echo "Python executable path: $PYTHON_EXE"
            if [ -f "$PYTHON_EXE" ]; then
              echo "Python version: $($PYTHON_EXE --version)"
              echo "Python location: $($PYTHON_EXE -c 'import sys; print(sys.executable)')"
            else
              echo "ERROR: Python executable not found at $PYTHON_EXE"
              echo "Attempting to find Python in virtual environment:"
              find .venv -name "python*" -type f 2>/dev/null || echo "No Python executables found"
            fi
          else
            echo "ERROR: Virtual environment not found"
            ls -la . || echo "Could not list current directory"
          fi
          
          echo "=== Installing PyInstaller ==="
          # PyInstaller installation in the virtual environment with verification
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -f "./.venv/Scripts/python.exe" ]; then
              ./.venv/Scripts/python.exe -m pip install --upgrade pip
              ./.venv/Scripts/python.exe -m pip install pyinstaller
              ./.venv/Scripts/python.exe -m pip show pyinstaller
              ./.venv/Scripts/python.exe -m PyInstaller --version
            else
              echo "ERROR: Cannot install PyInstaller - Python executable not found"
              exit 1
            fi
          else
            if [ -f "./.venv/bin/python" ]; then
              ./.venv/bin/python -m pip install --upgrade pip
              ./.venv/bin/python -m pip install pyinstaller
              ./.venv/bin/python -m pip show pyinstaller
              ./.venv/bin/python -m PyInstaller --version
            else
              echo "ERROR: Cannot install PyInstaller - Python executable not found"
              exit 1
            fi
          fi
      - name: Build desktop release
        shell: bash
        run: |
          echo "=== Building desktop release for ${{ matrix.runner }} ==="
          echo "Release script: ${{ matrix.release_script }}"
          echo "Expected output: ${{ matrix.artifact_folder }}"

          # Notarization is opt-in on the presence of credentials, so that a
          # repo without the Apple secrets still produces (unsigned) builds
          # instead of failing. electron-builder reads APPLE_ID,
          # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID from the environment.
          EXTRA_ARGS=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
              echo "Apple Developer ID credentials present: signing and notarizing."
              EXTRA_ARGS="-- --config.mac.notarize=true"
            else
              echo "::warning::No Apple credentials configured; this macOS build will be UNSIGNED and will fail Gatekeeper with 'damaged and can't be opened'."
            fi
          fi

          # Run the release script
          ${{ matrix.release_script }} $EXTRA_ARGS
          
          echo "=== Verifying build output ==="
          if [ -d "${{ matrix.artifact_folder }}" ]; then
            echo "✓ Output directory exists: ${{ matrix.artifact_folder }}"
            echo "Contents:"
            # `|| true` because this step runs under `bash -eo pipefail`: head
            # closes the pipe after 10 lines, find dies on EPIPE, and the whole
            # job used to fail here long after the release had been published.
            find "${{ matrix.artifact_folder }}" -type f | head -10 || true
            echo "Total files: $(find "${{ matrix.artifact_folder }}" -type f | wc -l)"
            echo "Directory size: $(du -sh "${{ matrix.artifact_folder }}" | cut -f1)"
          else
            echo "✗ Output directory missing: ${{ matrix.artifact_folder }}"
            echo "Available directories:"
            find . -maxdepth 3 -type d -name "*release*" -o -name "*wirelessboard*" 2>/dev/null || echo "No release directories found"
            echo "Current directory contents:"
            ls -la .
            exit 1
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.ref_name }}
          path: ${{ matrix.artifact_folder }}

  package-pi:
    if: github.event_name == 'workflow_dispatch' && inputs.build_pi == true
    name: Package Raspberry Pi bundle
    runs-on: [self-hosted, linux, arm64]
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r py/requirements.txt
          python -m pip install pyinstaller
      - name: Build Raspberry Pi release
        run: npm run release:pi
      - name: Upload Pi artifact
        uses: actions/upload-artifact@v4
        with:
          name: wirelessboard-pi-${{ github.ref_name }}
          path: release/pi/wirelessboard-pi-*.tar.gz
